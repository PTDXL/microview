# Builds the ready-made versions and attaches them to a GitHub release.
# Trigger: push a tag starting with "v" (e.g. v1.2), or run it manually ("Run workflow").
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        # An older Ubuntu keeps the file usable on older distributions.
        # To add Windows later: os: windows-latest (the build script runs in Git Bash).
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries to bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - name: Build portable version
        shell: bash
        run: packaging/build-portable.sh
      - name: Self-test the portable version (window and FFmpeg; the runner has no camera)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/MicroView-* --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: dist/*

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y rpm-build desktop-file-utils
      - uses: actions/checkout@v4
      - run: packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [portable, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "MicroView $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
